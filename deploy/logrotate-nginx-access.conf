/var/log/nginx/*.log /var/log/nginx/*.jsonl {
    create 0640 nginx root
    daily
    rotate 10
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        for pidfile in /run/nginx.pid /run/live-idol-timetable-nginx.pid /run/live-idol-timetable-personal-nginx.pid; do
            if [ -s "$pidfile" ]; then
                kill -USR1 "$(cat "$pidfile")" 2>/dev/null || true
            fi
        done
    endscript
}
