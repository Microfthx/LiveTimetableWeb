user nginx;
worker_processes auto;
error_log /var/log/nginx/live-idol-timetable-error.log notice;
pid /run/live-idol-timetable-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    sendfile on;
    map $request_uri $request_path { ~^([^?]*) $1; }
    log_format live_access escape=json '{"kind":"access","port":9999,"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$request_path","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/live-idol-timetable-access.jsonl live_access;

    server {
        listen 0.0.0.0:9999;
        server_name _;
        root /opt/live-idol-timetable/current;
        index index.html;

        location /api/ {
            client_max_body_size 80m;
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 270s;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
